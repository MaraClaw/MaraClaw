<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MaraClaw">
  <defs>
    <linearGradient id="mc-bg" x1="12" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8894F"/>
      <stop offset="55%" stop-color="#D06635"/>
      <stop offset="100%" stop-color="#A84522"/>
    </linearGradient>
    <linearGradient id="mc-shine" x1="18" y1="14" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F3D2B8" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="16" fill="url(#mc-bg)"/>

  <!-- Soft inner rim for depth -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#FFF8F2" stroke-opacity="0.18" stroke-width="1"/>

  <!--
    MaraClaw mark: a geometric claw gripping a spark-node.
    Reads as “claw + agency” at 16–32px without relying on a lobster emoji.
  -->
  <g fill="url(#mc-shine)">
    <!-- Palm / hinge -->
    <circle cx="28.5" cy="36.5" r="7.2"/>

    <!-- Upper pincer -->
    <path d="M31.2 30.6
      C36.2 24.8 42.4 20.2 49.2 18.4
      C50.8 18 52 19.6 51.2 21.1
      C48.4 26.2 44.1 30.4 38.8 33.4
      C36.6 34.7 33.8 34.1 31.8 32.4
      C31.2 31.9 31 31.2 31.2 30.6Z"/>

    <!-- Lower pincer -->
    <path d="M33.4 39.2
      C39.8 40.6 45.6 44.2 49.8 49.6
      C50.8 50.9 49.6 52.6 48 52
      C41.8 49.6 36.4 45.4 32.4 40.2
      C31.4 38.9 32.1 38.8 33.4 39.2Z"/>

    <!-- Thumb / rear claw arm -->
    <path d="M22.6 33.4
      C17.2 29.8 12.8 24.6 10.4 18.6
      C9.8 17.1 11.4 15.8 12.8 16.6
      C18.2 19.6 22.6 24.2 25.4 29.6
      C26.4 31.5 25 33.4 22.6 33.4Z"/>

    <!-- Joint knuckle -->
    <circle cx="24.8" cy="41.8" r="3.4"/>
  </g>

  <!-- AI spark / work node the claw is holding -->
  <g transform="translate(40.5 31.5)">
    <circle r="4.4" fill="#FFF8F2"/>
    <path
      d="M0 -2.6 L0.7 -0.7 L2.6 0 L0.7 0.7 L0 2.6 L-0.7 0.7 L-2.6 0 L-0.7 -0.7 Z"
      fill="#C25A2C"
    />
  </g>
</svg>
