# MaraClaw web-e — production SPA for the end-user UI (landing + members)
# - Non-privileged port 8080
# - Long-cache hashed assets, no-cache HTML
# - SPA fallback to index.html
# - Basic security headers + gzip
# - Access log without request targets, queries or credential headers

# Access records carry client address, time, method, status, size, timing and the upstream outcome. The request
# line, URI, query string, Referer, User-Agent, credential headers and bodies are never logged: webhook tokens and
# callback secrets travel in paths and queries. $maraclaw_route is a static label set per location below.
# This file is included inside the image's http block, so log_format is valid at this level.
log_format maraclaw_safe '$remote_addr [$time_iso8601] $request_method $status '
                         'bytes=$body_bytes_sent rt=$request_time '
                         'upstream=$upstream_status urt=$upstream_response_time '
                         'route=$maraclaw_route';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version in responses.
    server_tokens off;

    # Explicit safe format on the image's stdout-linked log; locations below that set access_log off stay silent.
    access_log /var/log/nginx/access.log maraclaw_safe;

    # Allow supported single-file 50 MiB uploads plus multipart framing, with a finite ceiling.
    client_max_body_size 51m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 65s;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/wasm;

    # Health probe for container orchestrators.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin engine proxy (docker DNS). Override host via extra_hosts if needed.
    location /api/ {
        set $maraclaw_route api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://maraclaw-engine:8000;
    }

    location /ws/ {
        set $maraclaw_route ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_pass http://maraclaw-engine:8000;
    }

    location /p/ {
        set $maraclaw_route page;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://maraclaw-engine:8000;
    }

    # Immutable hashed build assets (Vite: /assets/*)
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public static files (favicon, brand marks)
    location ~* \.(?:svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML entry + client routes: never long-cache index.html
    location / {
        set $maraclaw_route spa;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws: wss:" always;

        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
