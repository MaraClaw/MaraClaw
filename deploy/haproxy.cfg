# HAProxy 3.4. Compose publishes 80:8080 and 443:8443 only.
# Set API_DOMAIN, ADMIN_DOMAIN and MEMBER_DOMAIN to bare DNS hostnames.
# Port 8000 is private to the Compose network; 8404 is container-local only.
global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option dontlognull
    # No request/response buffering: SSE streams immediately; upgrades tunnel.
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout http-request 10s
    timeout tunnel 1h

resolvers docker
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s
    hold nx 5s
    hold refused 5s
    hold timeout 5s
    hold other 5s

frontend public_http
    bind :8080
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    acl api_host var(txn.host) -m str -i "${API_DOMAIN}"
    acl admin_host var(txn.host) -m str -i "${ADMIN_DOMAIN}"
    acl member_host var(txn.host) -m str -i "${MEMBER_DOMAIN}"
    http-request deny deny_status 403 unless api_host or admin_host or member_host
    # Use the stripped hostname rather than an attacker-supplied port.
    http-request redirect location https://%[var(txn.host)]%[url] code 301

frontend public_https
    bind :8443 ssl crt /usr/local/etc/haproxy/tls.pem alpn h2,http/1.1
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    acl api_host var(txn.host) -m str -i "${API_DOMAIN}"
    acl admin_host var(txn.host) -m str -i "${ADMIN_DOMAIN}"
    acl member_host var(txn.host) -m str -i "${MEMBER_DOMAIN}"
    acl engine_exact path -i /api /ws /p
    acl engine_prefix path_beg -i /api/ /ws/ /p/
    http-request deny deny_status 403 unless api_host or admin_host or member_host
    # This is the trust boundary. Retain Host, but replace proxy metadata.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Server
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    use_backend engine_pool if api_host
    use_backend engine_pool if engine_exact or engine_prefix
    use_backend admin_pool if admin_host
    use_backend member_pool if member_host

frontend engine_callback
    bind :8000
    http-request del-header Forwarded
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Server
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    default_backend engine_pool

frontend readiness
    bind 127.0.0.1:8404
    acl health_path path /healthz
    http-request return status 200 content-type text/plain string "ready" if health_path
    http-request return status 404

backend engine_pool
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    # No allow-dup-ip: each A record occupies at most one slot. Missing DNS at
    # startup is intentional; Docker DNS activates slots as replicas appear.
    server-template engine 16 engine:8000 check inter 5s resolvers docker resolve-prefer ipv4 init-addr none

backend admin_pool
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server-template admin 16 web-a:8080 check inter 5s resolvers docker resolve-prefer ipv4 init-addr none

backend member_pool
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server-template member 16 web-e:8080 check inter 5s resolvers docker resolve-prefer ipv4 init-addr none
