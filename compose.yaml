name: maraclaw

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-env: &runtime-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
  DEBUG: "false"
  ALLOW_MIGRATION_FAILURE: "false"
  SANDBOX_UNSAFE_FALLBACK: "false"
  SANDBOX_ALLOW_UNSAFE_FALLBACK_WHEN_BWRAP_MISSING: "false"
  CORS_ORIGINS: '["https://${API_DOMAIN:?Set API_DOMAIN}","https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}","https://${MEMBER_DOMAIN:?Set MEMBER_DOMAIN}"]'
  PUBLIC_BASE_URL: https://${MEMBER_DOMAIN:?Set MEMBER_DOMAIN}
  AGENT_DATA_DIR: ${DATA_DIR:?Set absolute DATA_DIR}/agents
  STORAGE_LOCAL_ROOT: ${DATA_DIR:?Set absolute DATA_DIR}/agents
  DOCKER_NETWORK: ${DOCKER_NETWORK:-maraclaw_network}
  OPENCLAW_ENGINE_BASE_URL: http://maraclaw-engine:8000
  LINKUP_PROXY_BASE_URL: http://maraclaw-engine:8000/api/linkup
  PLATFORM_ADMIN_EMAIL: ""
  PLATFORM_ADMIN_PASSWORD: ""
  INSTANCE_ID: ""
  START_COMMAND: exec uvicorn app.main:app --host 0.0.0.0 --port 8000

x-engine: &engine
  build:
    context: ./engine
  image: maraclaw-engine:${RELEASE_TAG:-local}
  env_file:
    - path: ${MARACLAW_ENV_FILE:-./deploy/.env}
      required: false
  environment: *runtime-env
  volumes:
    - type: bind
      source: ${DATA_DIR:?Set absolute DATA_DIR}
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_DIR:?Set absolute DATA_DIR}
      target: ${DATA_DIR:?Set absolute DATA_DIR}
      bind:
        create_host_path: false
    - /var/run/docker.sock:/var/run/docker.sock
  cap_add: [SYS_ADMIN, SETUID, SETGID, SYS_CHROOT, SETPCAP, NET_ADMIN, SYS_PTRACE]
  security_opt: [seccomp=unconfined]
  networks: [app]
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 60s
  logging: *logging
  cpus: ${ENGINE_CPUS:-1}
  mem_limit: ${ENGINE_MEMORY:-2g}
  healthcheck:
    test: [CMD, curl, -fsS, http://127.0.0.1:8000/api/ready]
    interval: 15s
    timeout: 5s
    retries: 6
    start_period: 60s

x-web: &web
  restart: unless-stopped
  stop_grace_period: 60s
  logging: *logging
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  networks: [app]
  cpus: ${WEB_CPUS:-0.25}
  mem_limit: ${WEB_MEMORY:-128m}
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  bootstrap:
    <<: *engine
    cpus: ${BOOTSTRAP_CPUS:-1}
    mem_limit: ${BOOTSTRAP_MEMORY:-1g}
    environment:
      <<: *runtime-env
      PROCESS_ROLE: bootstrap
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?Set PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD}
      PYTHONPATH: /app
      START_COMMAND: exec python /deployment/bootstrap.py
    volumes:
      - type: bind
        source: ./deploy/bootstrap.py
        target: /deployment/bootstrap.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR:?Set absolute DATA_DIR}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR:?Set absolute DATA_DIR}
        target: ${DATA_DIR:?Set absolute DATA_DIR}
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: {}
    restart: "no"
    healthcheck:
      disable: true

  engine:
    <<: *engine
    environment:
      <<: *runtime-env
      PROCESS_ROLE: api
    deploy:
      replicas: ${API_REPLICAS:-2}

  background:
    <<: *engine
    cpus: ${BACKGROUND_CPUS:-1}
    mem_limit: ${BACKGROUND_MEMORY:-2g}
    environment:
      <<: *runtime-env
      PROCESS_ROLE: worker,connector
    deploy:
      replicas: 1

  web-a:
    <<: *web
    build:
      context: ./web-a
      args:
        NODE_VERSION: ${WEB_NODE_VERSION:-26.11.1}
    image: maraclaw-web-a:${RELEASE_TAG:-local}
    deploy:
      replicas: ${ADMIN_REPLICAS:-2}

  web-e:
    <<: *web
    build:
      context: ./web-e
      args:
        NODE_VERSION: ${WEB_NODE_VERSION:-26.11.1}
    image: maraclaw-web-e:${RELEASE_TAG:-local}
    depends_on:
      ingress:
        condition: service_started
    deploy:
      replicas: ${MEMBER_REPLICAS:-2}

  ingress:
    image: haproxy:${HAPROXY_TAG:-3.4.6-alpine}
    user: "0:0"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      MEMBER_DOMAIN: ${MEMBER_DOMAIN:?Set MEMBER_DOMAIN}
    volumes:
      - type: bind
        source: ./deploy/haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_PEM_PATH:?Set TLS_PEM_PATH}
        target: /usr/local/etc/haproxy/tls.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AUTOSCALER_STATE_DIR:-/var/lib/maraclaw-autoscaler}
        target: /run/maraclaw-autoscaler
        bind:
          create_host_path: false
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    networks:
      app:
        aliases: [maraclaw-engine]
      guest:
        aliases: [maraclaw-engine]
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8404/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    cpus: ${INGRESS_CPUS:-0.5}
    mem_limit: ${INGRESS_MEMORY:-256m}

networks:
  app: {}
  guest:
    name: ${DOCKER_NETWORK:-maraclaw_network}
