name: Frontend CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [web-a, web-e]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check API contract freshness
        run: npm run contracts:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check entry and route bundle size budgets
        run: node ../.github/scripts/check-bundle-budget.mjs
      - name: Build final Caddy image
        run: docker build --tag maraclaw-${{ matrix.package }}:ci .

  browser:
    name: Browser tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web-e
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: web-e/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser tests (shard ${{ matrix.shard }}/4)
        run: npm run test:e2e -- --workers=2 --shard=${{ matrix.shard }}/4 --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e-playwright-${{ matrix.shard }}
          path: |
            web-e/playwright-report/
            web-e/test-results/
          retention-days: 14
          if-no-files-found: warn

  admin-browser:
    name: Selected admin browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-a
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: web-a/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Selected company, payment navigation and admin access regressions
        run: npm run test:e2e
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload admin browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-a-selected-playwright
          path: |
            web-a/playwright-report/
            web-a/test-results/
          retention-days: 14
          if-no-files-found: warn
