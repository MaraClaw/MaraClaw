name: Engine CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: engine
    shell: bash

env:
  UV_LOCKED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  native-gateway-rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Test native gateway RPC
        run: node --test tests/openclaw_gateway_rpc.test.mjs

  whatsapp-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine/connectors/whatsapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: engine/connectors/whatsapp/package-lock.json
      - name: Install locked bridge dependencies
        run: npm ci
      - name: Test bridge contracts
        run: npm test
      - name: Build bridge
        run: npm run build

  zalo-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine/connectors/zalo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: engine/connectors/zalo/package-lock.json
      - name: Install locked bridge dependencies
        run: npm ci
      - name: Test bridge contracts and image metadata
        run: npm test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: engine
          version: "0.13.7"
          enable-cache: true
      - name: Sync dependencies
        id: sync
        run: uv sync --locked --extra dev
      - name: Ruff lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev ruff check .
      - name: Ruff formatting
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: engine
          version: "0.13.7"
          enable-cache: true
      - name: Sync dependencies
        id: sync
        run: uv sync --locked --extra dev
      - name: Check API contract freshness
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev python -m scripts.export_api_contracts --check
      - name: basedpyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev basedpyright --project pyrightconfig.json
      - name: ty
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev ty check --force-exclude .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: engine
          version: "0.13.7"
          enable-cache: true
      - name: Sync dependencies
        id: sync
        run: uv sync --locked --extra dev
      - name: Test with scoped coverage gate
        id: tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: --cov-report=xml:coverage.xml --cov-report=html:htmlcov
        run: bash scripts/test.sh
      - name: Upload coverage
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-coverage
          path: |
            engine/coverage.xml
            engine/htmlcov/
          retention-days: 14
          if-no-files-found: error

  lifecycle-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: lifecycle_qa
          POSTGRES_PASSWORD: lifecycle_qa
          POSTGRES_DB: lifecycle_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifecycle_qa -d lifecycle_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_SETUP_TEST_DATABASE_URL: postgresql://lifecycle_qa:lifecycle_qa@localhost:5432/lifecycle_qa
      AGENT_SETUP_TEST_DATABASE_DISPOSABLE: "1"
      MARACLAW_TEST_POSTGRES_DSN: postgresql://lifecycle_qa:lifecycle_qa@localhost:5432/lifecycle_qa
      CHAT_SUBMISSION_TEST_DATABASE_URL: postgresql://lifecycle_qa:lifecycle_qa@localhost:5432/lifecycle_qa
      BOOTSTRAP_TEST_DATABASE_URL: postgresql://lifecycle_qa:lifecycle_qa@localhost:5432/lifecycle_qa
      MARACLAW_TEST_REDIS_URL: redis://localhost:6379/0
      AUTH_EMAIL_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: engine
          version: "0.13.7"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Test full suite with PostgreSQL and Redis
        run: uv run --no-sync python -m pytest -q
