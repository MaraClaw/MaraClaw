name: Engine CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: engine
    shell: bash

env:
  UV_LOCKED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [web-a, web-e]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.11.1"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Build final nginx image
        run: docker build --tag maraclaw-${{ matrix.package }}:ci .
      - name: Smoke final nginx image
        working-directory: .
        run: bash deploy/smoke_frontend_image.sh maraclaw-${{ matrix.package }}:ci

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: engine
          version: "0.12.23"
          enable-cache: true
      - name: Sync dependencies
        id: sync
        run: uv sync --locked --extra dev
      - name: Ruff lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev ruff check .
      - name: Ruff formatting
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: engine
          version: "0.12.23"
          enable-cache: true
      - name: Sync dependencies
        id: sync
        run: uv sync --locked --extra dev
      - name: basedpyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev basedpyright --project pyrightconfig.json app
      - name: ty
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --extra dev ty check --force-exclude .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: engine
          version: "0.12.23"
          enable-cache: true
      - name: Sync dependencies
        id: sync
        run: uv sync --locked --extra dev
      - name: Test with scoped coverage gate
        id: tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: --cov-report=xml:coverage.xml --cov-report=html:htmlcov
        run: bash scripts/test.sh
      - name: Upload coverage
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-coverage
          path: |
            engine/coverage.xml
            engine/htmlcov/
          retention-days: 14
          if-no-files-found: error
